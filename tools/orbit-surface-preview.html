<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Orbital surface diagnostics</title>
    <link rel="stylesheet" href="../src/assets/fonts/fonts.css" />
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 24px;
        background: #080b0b;
        color: #bed2ca;
        font: 14px monospace;
      }
      h1 {
        margin: 0 0 12px;
        font-size: 22px;
      }
      h2 {
        margin: 0;
        font-size: 16px;
        color: #85c9bb;
      }
      p {
        line-height: 1.5;
      }
      section {
        border-top: 1px solid #34534a;
        padding: 16px 0;
      }
      .views {
        display: grid;
        grid-template-columns: repeat(5, minmax(0, 1fr));
        gap: 12px;
      }
      figure {
        margin: 0;
        min-width: 0;
      }
      canvas {
        display: block;
        width: 100%;
        aspect-ratio: 1;
        background: #000;
        image-rendering: pixelated;
      }
      figcaption {
        padding: 8px 0;
        color: #c9b27b;
      }
      .properties {
        margin: 8px 0 12px;
        color: #91a7a0;
      }
      #status {
        color: #c9b27b;
      }
      @media (max-width: 900px) {
        .views {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
      }
      @media (max-width: 440px) {
        body {
          margin: 12px;
        }
        .views {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <h1>Orbital surface diagnostics</h1>
    <p id="settings"></p>
    <p id="status" role="status">Preparing generated terrain...</p>
    <main></main>
    <script id="diagnostics" type="application/json">
      null
    </script>
    <script type="module">
      import { Planet } from '../src/entities/planet.ts';
      import { SolarSystem } from '../src/entities/solar_system.ts';
      import { CONFIG } from '../src/config.ts';
      import { PRNG } from '../src/utils/prng.ts';
      import { AU_IN_METERS } from '../src/constants/physics.ts';
      import { getSurfaceDisplayColour } from '../src/entities/planet/surface_material.ts';
      import { ScreenBuffer } from '../src/rendering/screen_buffer.ts';
      import { SceneRenderer } from '../src/rendering/scene_renderer.ts';
      import { DrawingContext } from '../src/rendering/drawing_context.ts';
      import { NebulaRenderer } from '../src/rendering/nebula_renderer.ts';
      import { SystemDataGenerator } from '../src/generation/system_data_generator.ts';
      import { hexToRgb } from '../src/rendering/colour.ts';
      import { orbitSurfaceNormal, orbitSunDirection } from '../src/rendering/scenes/orbit_lighting.ts';
      import { logger, LogLevel } from '../src/utils/logger.ts';
      import {
        SETTLEMENT_VISUAL_PRESETS,
        settlementTerraformingFixture,
      } from '../src/tests/fixtures/settlements.ts';

      logger.setLogLevel(LogLevel.ERROR);
      const query = new URLSearchParams(location.search);
      const fullPhase = 1 - 0.55 / (2 * Math.PI);
      const phases = {
        full: fullPhase,
        quarter: (fullPhase + 0.25) % 1,
        crescent: 0.35,
        night: (fullPhase + 0.5) % 1,
      };
      const phaseName = query.get('phase') ?? 'full';
      const phase = phases[phaseName];
      if (phase === undefined) throw new Error('phase must be full, quarter, crescent, or night');
      const radius = Number(query.get('radius') ?? 26);
      if (!Number.isInteger(radius) || radius < 10 || radius > 26) throw new Error('radius must be 10..26');
      const starCount = Number(query.get('stars') ?? 1);
      if (![1, 2, 3].includes(starCount)) throw new Error('stars must be 1, 2, or 3');
      const seed = query.get('seed') ?? 'orbit-surface-baseline-v1';
      const suite = query.get('suite') ?? 'surfaces';
      if (!['surfaces', 'settlements'].includes(suite)) throw new Error('Unknown diagnostic suite');
      const surfacePresets = [
        { id: 'lunar', type: 'Lunar', distanceAu: 1 },
        { id: 'rock', type: 'Rock', distanceAu: 1 },
        { id: 'carbon', type: 'CarbonRich', distanceAu: 0.9 },
        { id: 'frozen', type: 'Frozen', distanceAu: 5 },
        { id: 'ocean', type: 'Oceanic', distanceAu: 1 },
        { id: 'greenhouse', type: 'Greenhouse', distanceAu: 0.7 },
        { id: 'dwarf-ice', type: 'DwarfIce', distanceAu: 35 },
      ];
      const presets = (suite === 'settlements' ? SETTLEMENT_VISUAL_PRESETS : surfacePresets).filter(
        (preset) => !query.has('body') || preset.id === query.get('body')
      );
      if (!presets.length) throw new Error('Unknown body preset');
      const size = 96;
      const rotation = Number(query.get('rotation') ?? 0.35);
      if (!Number.isFinite(rotation) || rotation < 0 || rotation >= 1)
        throw new Error('rotation must be 0..<1');
      const pressureOverride = query.has('pressure') ? Number(query.get('pressure')) : null;
      if (pressureOverride !== null && (!Number.isFinite(pressureOverride) || pressureOverride < 0))
        throw new Error('pressure must be nonnegative bar');
      const step = 1 / 2048;
      const manifest = {
        version: 1,
        settings: {
          seed,
          suite,
          phaseName,
          phase,
          radius,
          starCount,
          rotation,
          rotationStep: step,
          pressureOverride,
        },
        fixtures: [],
      };
      document.querySelector('#settings').textContent =
        `${suite} | ${seed} | ${phaseName} | ${radius * 2} globe pixels | ${starCount} stellar sources`;
      const generator = new SystemDataGenerator(new PRNG('orbit-surface-diagnostics'));

      /** Creates a native-resolution canvas with a black background. */
      function canvasAt(width, height = width) {
        const canvas = document.createElement('canvas');
        canvas.width = width;
        canvas.height = height;
        return canvas;
      }

      /** Converts captured display pixels to reproducible statistics over a common mask. */
      function statistics(image, mask) {
        const values = [];
        let neighbourDelta = 0;
        let pairs = 0;
        const luma = new Float64Array(mask.length);
        for (let i = 0; i < mask.length; i++) {
          const offset = i * 4;
          luma[i] =
            image.data[offset] * 0.2126 + image.data[offset + 1] * 0.7152 + image.data[offset + 2] * 0.0722;
          if (mask[i]) values.push(luma[i]);
        }
        for (let y = 0; y < image.height; y++) {
          for (let x = 0; x < image.width; x++) {
            const i = y * image.width + x;
            if (!mask[i]) continue;
            for (const j of [x + 1 < image.width ? i + 1 : -1, y + 1 < image.height ? i + image.width : -1]) {
              if (j >= 0 && mask[j]) {
                neighbourDelta += Math.abs(luma[i] - luma[j]);
                pairs++;
              }
            }
          }
        }
        if (!values.length) return { pixels: 0, mean: null, standardDeviation: null, neighbourDelta: null };
        const mean = values.reduce((sum, value) => sum + value, 0) / values.length;
        const variance = values.reduce((sum, value) => sum + (value - mean) ** 2, 0) / values.length;
        return {
          pixels: values.length,
          mean,
          standardDeviation: Math.sqrt(variance),
          neighbourDelta: pairs ? neighbourDelta / pairs : null,
        };
      }

      /** Selects common interior pixels, including unlit ground for night diagnostics. */
      function globeMask(sources) {
        const mask = new Uint8Array(size * size);
        for (let y = 0; y < size; y++) {
          for (let x = 0; x < size; x++) {
            const nx = (x - size / 2) / radius;
            const ny = -(y - size / 2) / radius;
            if (Math.hypot(nx, ny) >= 0.85) continue;
            const normal = orbitSurfaceNormal(nx, ny);
            if (!normal) continue;
            mask[y * size + x] = Number(
              phaseName === 'night' ||
                sources.some((source) => {
                  const sun = orbitSunDirection(phase * 2 * Math.PI - (source.longitudeOffset ?? 0));
                  return normal.x * sun.x + normal.y * sun.y + normal.z * sun.z > 0.25;
                })
            );
          }
        }
        return mask;
      }

      /** Hashes all displayed RGBA values independently of PNG compression. */
      async function pixelHash(image) {
        const digest = await crypto.subtle.digest('SHA-256', image.data);
        return Array.from(new Uint8Array(digest), (value) => value.toString(16).padStart(2, '0')).join('');
      }

      /** Adds a native raster and records both its pixels and its display-space measurements. */
      async function recordStage(container, id, title, canvas, mask) {
        canvas.dataset.stage = id;
        const figure = document.createElement('figure');
        const caption = document.createElement('figcaption');
        caption.textContent = title;
        figure.append(canvas, caption);
        container.append(figure);
        const image = canvas.getContext('2d').getImageData(0, 0, canvas.width, canvas.height);
        return {
          width: canvas.width,
          height: canvas.height,
          hash: await pixelHash(image),
          statistics: statistics(image, mask),
          png: canvas.toDataURL('image/png'),
        };
      }

      /** Shows full-resolution generated elevation and the exact colour classes used on the surface. */
      function sourceMaps(surface) {
        const height = surface.heightmap.length;
        const width = surface.heightmap[0].length;
        const elevation = canvasAt(width, height);
        const colours = canvasAt(width, height);
        const heightPixels = elevation.getContext('2d').createImageData(width, height);
        const colourPixels = colours.getContext('2d').createImageData(width, height);
        const liquid = surface.liquidOverlay;
        for (let y = 0; y < height; y++) {
          for (let x = 0; x < width; x++) {
            const value = Math.max(
              0,
              Math.min(surface.heightLevelColors.length - 1, Math.round(surface.heightmap[y][x]))
            );
            const i = (y * width + x) * 4;
            heightPixels.data.set([value, value, value, 255], i);
            const rgb = hexToRgb(
              getSurfaceDisplayColour(value, surface.heightLevelColors, liquid, surface.materialMap, x, y)
            );
            colourPixels.data.set([rgb.r, rgb.g, rgb.b, 255], i);
          }
        }
        elevation.getContext('2d').putImageData(heightPixels, 0, 0);
        colours.getContext('2d').putImageData(colourPixels, 0, 0);
        return { elevation, colours, mask: new Uint8Array(width * height).fill(1) };
      }

      /** Compares consecutive displayed frames at fixed lighting, excluding the silhouette. */
      function frameDifference(before, after, mask) {
        let total = 0;
        let maximum = 0;
        let count = 0;
        let changedPixels = 0;
        for (let i = 0; i < mask.length; i++) {
          if (!mask[i]) continue;
          let changed = false;
          for (let channel = 0; channel < 3; channel++) {
            const delta = Math.abs(before.data[i * 4 + channel] - after.data[i * 4 + channel]);
            total += delta;
            maximum = Math.max(maximum, delta);
            count++;
            if (delta > 0) changed = true;
          }
          if (changed) changedPixels++;
        }
        return {
          changedPixels,
          meanChannelDelta: count ? total / count : null,
          maxChannelDelta: count ? maximum : null,
        };
      }

      /** Generates one real terrain fixture and captures it through the production globe renderer. */
      async function collectFixture(preset) {
        const start = performance.now();
        let planet;
        if (preset.id === 'starting-colony') {
          const root = new PRNG(seed);
          const systems = new SystemDataGenerator(root);
          const x = CONFIG.PLAYER_START_X + CONFIG.STARTING_HUB_OFFSET_X;
          const y = CONFIG.PLAYER_START_Y + CONFIG.STARTING_HUB_OFFSET_Y;
          const hub = new SolarSystem(systems.getSystemProperties(x, y), x, y, root);
          if (!hub.colonyWorld) throw new Error('Starting hub has no colony');
          planet = hub.colonyWorld;
        } else {
          planet = new Planet(
            preset.id,
            preset.type,
            preset.distanceAu * AU_IN_METERS,
            0,
            new PRNG(seed),
            'G2V'
          );
        }
        if (preset.stage) planet.applyTerraforming(settlementTerraformingFixture(preset.stage));
        planet.ensureSurfaceReady();
        const generationMs = performance.now() - start;
        const surface = planet.getSurfaceDataIfReady();
        if (!surface?.heightmap || !surface.heightLevelColors)
          throw new Error(`Missing terrain: ${preset.id}`);
        // Optical interventions preserve exactly the generated geology and city
        // footprint, allowing extinction comparisons on the same physical surface.
        if (pressureOverride !== null) {
          Object.defineProperty(planet, 'effectiveAtmosphere', {
            value: { ...planet.effectiveAtmosphere, pressure: pressureOverride },
          });
        }
        const noCities = Object.create(planet);
        const naturalSurface = { ...surface, settlements: null };
        Object.defineProperty(noCities, 'getSurfaceDataIfReady', {
          /** Returns the same prepared terrain with only the decorative city layer disabled. */
          value() {
            return naturalSurface;
          },
        });
        // Removing air is a diagnostic intervention on this same terrain, not a
        // second generation with different erosion, liquids, or random numbers.
        const bare = Object.create(planet);
        Object.defineProperty(bare, 'effectiveAtmosphere', {
          value: { pressure: 0, density: 'None', composition: {} },
        });
        const flux =
          preset.id === 'starting-colony' ? planet.referenceStellarFluxWm2 : 1361 / preset.distanceAu ** 2;
        const sources = [
          {
            id: 'A',
            primary: true,
            brightness: 1,
            colour: '#FFFFFF',
            irradianceWm2: flux,
            temperatureK: 5772,
          },
          {
            id: 'B',
            primary: false,
            brightness: 0.4,
            colour: '#FFFFFF',
            irradianceWm2: flux * 0.4,
            temperatureK: 3000,
            longitudeOffset: 1.2,
          },
          {
            id: 'C',
            primary: false,
            brightness: 0.15,
            colour: '#FFFFFF',
            irradianceWm2: flux * 0.15,
            temperatureK: 10000,
            longitudeOffset: -1.1,
          },
        ].slice(0, starCount);
        const mask = globeMask(sources);
        const main = canvasAt(size);
        const raster = canvasAt(size);
        const buffer = new ScreenBuffer(main, main.getContext('2d'), false, raster, raster.getContext('2d'));
        buffer.updateDimensions(size / 2, size / 2, 2, 2);
        const renderer = new SceneRenderer(
          buffer,
          new DrawingContext(buffer),
          new NebulaRenderer(),
          generator
        );
        const prepareStart = performance.now();
        renderer.prepareOrbitAssets(suite === 'settlements' ? [planet, bare, noCities] : [planet, bare]);
        const prepareMs = performance.now() - prepareStart;
        const compose = renderer.composeOrbitRadiance;

        /** Calls the actual globe path, bypassing lighting only for the albedo diagnostic. */
        function render(body, albedoOnly = false, rotationPhase = rotation) {
          buffer.clear(true);
          if (albedoOnly) renderer.composeOrbitRadiance = (sample) => sample?.albedo ?? { r: 0, g: 0, b: 0 };
          try {
            renderer.drawRotatingPlanetSphere(
              { selectedBody: body, rotationPhase, illuminationPhase: phase, stellarSources: sources },
              size / 4,
              size / 4,
              radius / 2
            );
          } finally {
            renderer.composeOrbitRadiance = compose;
          }
          buffer.renderFull();
          const result = canvasAt(size);
          const context = result.getContext('2d');
          context.drawImage(main, 0, 0);
          context.drawImage(raster, 0, 0);
          return result;
        }

        /** Captures the production landing map or regional travel path at fixed terrain coordinates. */
        function renderGround(view) {
          const groundSize = size * 4;
          const groundMain = canvasAt(groundSize);
          const groundRaster = canvasAt(groundSize);
          const groundBuffer = new ScreenBuffer(
            groundMain,
            groundMain.getContext('2d'),
            false,
            groundRaster,
            groundRaster.getContext('2d')
          );
          groundBuffer.updateDimensions(size / 2, size / 2, 8, 8);
          const groundRenderer = new SceneRenderer(
            groundBuffer,
            new DrawingContext(groundBuffer),
            new NebulaRenderer(),
            generator
          );
          const centre = Math.floor(surface.heightmap.length / 2);
          if (view === 'map') {
            groundRenderer.drawOrbitLandingMap(
              {
                selectedBody: planet,
                mapSize: surface.heightmap.length,
                landingCursorX: centre,
                landingCursorY: centre,
                mode: 'landing',
              },
              2,
              2,
              44,
              36
            );
          } else {
            groundRenderer.drawPlanetSurface(
              {
                position: {
                  worldX: 0,
                  worldY: 0,
                  systemX: 0,
                  systemY: 0,
                  surfaceX: centre,
                  surfaceY: centre,
                },
                render: { char: '@', fgColor: '#00A0A0' },
                resources: { credits: 5000, fuel: 500, maxFuel: 500 },
                /** Supplies the snapshot distance contract without introducing a mutable Player. */
                distanceSqToSystemCoords(x, y) {
                  return x * x + y * y;
                },
              },
              planet
            );
          }
          groundBuffer.renderFull();
          const result = canvasAt(groundSize);
          result.getContext('2d').drawImage(groundMain, 0, 0);
          result.getContext('2d').drawImage(groundRaster, 0, 0);
          return result;
        }

        const section = document.createElement('section');
        section.dataset.body = preset.id;
        const heading = document.createElement('h2');
        heading.textContent = `${preset.id} / ${planet.type}`;
        const properties = document.createElement('p');
        properties.className = 'properties';
        properties.textContent = `${planet.diameter.toFixed(0)} km | ${planet.gravity.toFixed(2)} g | ${planet.effectiveSurfaceTemp.toFixed(0)} K | ${planet.effectiveAtmosphere.pressure.toPrecision(3)} bar | ${planet.effectiveHydrosphere}`;
        const views = document.createElement('div');
        views.className = 'views';
        section.append(heading, properties, views);
        document.querySelector('main').append(section);
        const maps = sourceMaps(surface);
        const stages = {};
        let cityEffect = null;
        stages.elevation = await recordStage(
          views,
          'elevation',
          'Generated elevation',
          maps.elevation,
          maps.mask
        );
        stages.sourceColour = await recordStage(
          views,
          'sourceColour',
          'Source surface colours',
          maps.colours,
          maps.mask
        );
        stages.albedo = await recordStage(
          views,
          'albedo',
          'Filtered globe colours',
          render(bare, true),
          mask
        );
        stages.bare = await recordStage(views, 'bare', 'Lit terrain / air removed', render(bare), mask);
        const firstStart = performance.now();
        const atmospheric = render(planet);
        const firstFrameMs = performance.now() - firstStart;
        stages.atmosphere = await recordStage(
          views,
          'atmosphere',
          'Lit terrain / generated air',
          atmospheric,
          mask
        );
        if (suite === 'settlements') {
          const withoutCities = render(noCities);
          stages.noCities = await recordStage(
            views,
            'noCities',
            'Same terrain / cities disabled',
            withoutCities,
            mask
          );
          cityEffect = frameDifference(
            withoutCities.getContext('2d').getImageData(0, 0, size, size),
            atmospheric.getContext('2d').getImageData(0, 0, size, size),
            mask
          );
          const groundMask = new Uint8Array(size * size * 16).fill(1);
          stages.landingMap = await recordStage(
            views,
            'landingMap',
            'Landing map',
            renderGround('map'),
            groundMask
          );
          stages.surfaceTravel = await recordStage(
            views,
            'surfaceTravel',
            'Regional travel',
            renderGround('surface'),
            groundMask
          );
        }
        const frames = [];
        let previous = atmospheric.getContext('2d').getImageData(0, 0, size, size);
        for (let frame = 1; frame <= 6; frame++) {
          const frameStart = performance.now();
          const next = render(planet, false, rotation + step * frame);
          const milliseconds = performance.now() - frameStart;
          const pixels = next.getContext('2d').getImageData(0, 0, size, size);
          frames.push({ milliseconds, ...frameDifference(previous, pixels, mask) });
          previous = pixels;
        }
        return {
          ...preset,
          mapSeed: planet.mapSeed,
          diameterKm: planet.diameter,
          gravityG: planet.gravity,
          temperatureK: planet.effectiveSurfaceTemp,
          axialTilt: planet.axialTilt,
          atmosphere: planet.effectiveAtmosphere,
          hydrosphere: planet.effectiveHydrosphere,
          liquid: surface.liquidOverlay,
          settlements: surface.settlements ?? null,
          cityEffect,
          sources,
          timings: { generationMs, prepareMs, firstFrameMs },
          frames,
          stages,
        };
      }

      /** Prepares the selected fixture suite and publishes its serializable capture report. */
      window.orbitSurfaceDiagnostics = (async () => {
        try {
          await Promise.all([
            document.fonts.load('8px "PxPlus_IBM_CGA"'),
            document.fonts.load('8px "PxPlus_IBM_CGAthin"'),
          ]);
          for (const preset of presets) {
            document.querySelector('#status').textContent = `Rendering ${preset.id}...`;
            await new Promise((resolve) => setTimeout(resolve, 0));
            manifest.fixtures.push(await collectFixture(preset));
          }
          document.querySelector('#diagnostics').textContent = JSON.stringify(manifest);
          document.querySelector('#status').textContent =
            `Complete: ${manifest.fixtures.length} generated worlds.`;
          document.body.dataset.ready = 'true';
          return manifest;
        } catch (error) {
          document.body.dataset.ready = 'error';
          document.querySelector('#status').textContent = error.stack ?? String(error);
          throw error;
        }
      })();
    </script>
  </body>
</html>
