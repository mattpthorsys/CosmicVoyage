<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Orbital lighting regression preview</title>
    <style>
      body {
        margin: 16px;
        background: #080808;
        color: #b9ddd6;
        font: 14px monospace;
      }
      main {
        display: grid;
        grid-template-columns: repeat(auto-fit, 296px);
        gap: 12px;
      }
      figure {
        margin: 0;
      }
      canvas {
        width: 296px;
        height: 264px;
        image-rendering: pixelated;
      }
      figcaption {
        padding: 6px 0;
      }
    </style>
  </head>
  <body>
    <p>Orbital lighting: fixed terrain or giant cloud textures; clear gas above the visible boundary</p>
    <main></main>
    <script type="module">
      import '../src/assets/fonts/fonts.css';
      import { ScreenBuffer } from '../src/rendering/screen_buffer.ts';
      import { SceneRenderer } from '../src/rendering/scene_renderer.ts';
      import { DrawingContext } from '../src/rendering/drawing_context.ts';
      import { NebulaRenderer } from '../src/rendering/nebula_renderer.ts';
      import { SystemDataGenerator } from '../src/generation/system_data_generator.ts';
      import { PRNG } from '../src/utils/prng.ts';
      import { Planet } from '../src/entities/planet.ts';
      import { ORBIT_CAMERA_DISTANCE, orbitSunDirection } from '../src/rendering/scenes/orbit_lighting.ts';
      await document.fonts.ready;
      const initialSun = orbitSunDirection(0);
      const fullPhase = (1 + Math.atan2(initialSun.x, initialSun.z) / (2 * Math.PI)) % 1;
      const occultedPhase = (fullPhase + 0.5) % 1;
      const contactOffset =
        Math.acos(Math.sqrt(1 - 1 / ORBIT_CAMERA_DISTANCE ** 2) / Math.sqrt(1 - initialSun.y ** 2)) /
        (2 * Math.PI);
      const phases = [
        { name: 'Full', phase: fullPhase },
        { name: 'Quarter', phase: (fullPhase + 0.25) % 1 },
        { name: 'Crescent', phase: occultedPhase - contactOffset - 0.012 },
        { name: 'Ingress', phase: occultedPhase - contactOffset },
        { name: 'Occulted', phase: occultedPhase },
        { name: 'Egress', phase: occultedPhase + contactOffset },
      ];
      const profiles = [
        {
          name: 'Earth-like',
          pressure: 1.01325,
          temperature: 288,
          gases: { Nitrogen: 78, Oxygen: 21, Argon: 1 },
        },
        { name: 'Airless', pressure: 0, temperature: 288, gases: {} },
        { name: 'Tenuous / near-airless limit', pressure: 1e-8, temperature: 288, gases: {} },
        { name: 'Airless / cool star', pressure: 0, temperature: 288, gases: {}, starTemperature: 3000 },
        { name: 'Airless / 2000 AU', pressure: 0, temperature: 288, gases: {}, distance: 2000 },
        {
          name: 'Earth-like optics / 2000 AU',
          pressure: 1.01325,
          temperature: 288,
          gases: { Nitrogen: 78, Oxygen: 21, Argon: 1 },
          distance: 2000,
        },
        {
          name: 'Hydrogen / below shell limit',
          pressure: 1,
          temperature: 300,
          gases: { Hydrogen: 100 },
          gravity: 1,
          diameter: 12742,
        },
        {
          name: 'Hydrogen / above shell limit',
          pressure: 1,
          temperature: 320,
          gases: { Hydrogen: 100 },
          gravity: 1,
          diameter: 12742,
        },
        { name: 'Thin CO2', pressure: 0.006, temperature: 210, gases: { 'Carbon Dioxide': 95, Nitrogen: 5 } },
        {
          name: 'Dense CO2 (clear gas only)',
          pressure: 90,
          temperature: 735,
          gases: { 'Carbon Dioxide': 96, Nitrogen: 4 },
        },
        {
          name: 'Cool star / equal total flux',
          pressure: 1.01325,
          temperature: 288,
          gases: { Nitrogen: 78, Oxygen: 21, Argon: 1 },
          starTemperature: 3000,
        },
        {
          name: 'Double distance / quarter flux',
          pressure: 1.01325,
          temperature: 288,
          gases: { Nitrogen: 78, Oxygen: 21, Argon: 1 },
          distance: 2,
        },
        {
          name: 'Gas giant / deep pressure 90 bar',
          type: 'GasGiant',
          pressure: 90,
          temperature: 130,
          gases: { Hydrogen: 85, Helium: 15 },
          diameter: 140000,
          gravity: 2.4,
          distance: 5,
        },
        {
          name: 'Ice giant / deep pressure 90 bar',
          type: 'IceGiant',
          pressure: 90,
          temperature: 78,
          gases: { Hydrogen: 80, Helium: 18, Methane: 2 },
          diameter: 50000,
          gravity: 1.1,
          distance: 20,
        },
      ];
      for (const profile of profiles) {
        for (const { name: phaseName, phase } of phases) {
          const planet = Object.create(Planet.prototype);
          Object.defineProperties(planet, {
            name: { value: 'Lighting fixture' },
            type: { value: profile.type ?? 'Rock' },
            orbitDistance: { value: (profile.distance ?? 1) * 1.496e11 },
            systemPRNG: { value: new PRNG('lighting-giant') },
            heightmap: {
              value: Array.from({ length: 32 }, (_, y) => Array.from({ length: 32 }, (_, x) => (x + y) % 8)),
            },
            heightLevelColors: {
              value: Array.from({ length: 256 }, (_, i) => '#' + i.toString(16).padStart(2, '0') + '7050'),
            },
            diameter: { value: profile.diameter ?? 11000 },
            density: { value: 5.1 },
            gravity: { value: profile.gravity ?? 0.95 },
            surfaceTemp: { value: profile.temperature },
            axialTilt: { value: 0.23 },
            orbitalInclination: { value: 0.03 },
            moons: { value: [] },
            atmosphere: {
              value: {
                density: profile.pressure ? 'Dense' : 'None',
                pressure: profile.pressure,
                composition: profile.gases,
              },
            },
            getCurrentTemperature: { value: () => profile.temperature },
          });
          const mainCanvas = document.createElement('canvas');
          const raster = document.createElement('canvas');
          for (const canvas of [mainCanvas, raster]) {
            canvas.width = 132 * 8;
            canvas.height = 58 * 8;
          }
          const buffer = new ScreenBuffer(
            mainCanvas,
            mainCanvas.getContext('2d'),
            false,
            raster,
            raster.getContext('2d')
          );
          buffer.updateDimensions(132, 58, 8, 8);
          const renderer = new SceneRenderer(
            buffer,
            new DrawingContext(buffer),
            new NebulaRenderer(),
            new SystemDataGenerator(new PRNG('preview'))
          );
          const model = {
            title: 'Orbital Operations',
            subtitle: '',
            parentPlanet: planet,
            selectedBody: planet,
            bodies: [],
            mode: 'overview',
            stellarSources: [
              {
                id: 'A',
                primary: true,
                brightness: 1,
                colour: '#FFFACD',
                irradianceWm2: 1361 / (profile.distance ?? 1) ** 2,
                temperatureK: profile.starTemperature ?? 5772,
                angularRadius:
                  (0.00465 / (profile.distance ?? 1)) * (5772 / (profile.starTemperature ?? 5772)) ** 2,
              },
            ],
            rotationPhase: 0.35,
            illuminationPhase: phase,
            landingCursorX: 12,
            landingCursorY: 18,
            mapSize: 32,
            description: [],
            telemetry: [],
            footer: [],
          };
          renderer.drawOrbitInterface(model);
          buffer.renderFull();
          const start = performance.now();
          for (let frame = 0; frame < 10; frame++) {
            buffer.clear(false);
            renderer.drawOrbitInterface({ ...model, illuminationPhase: phase + frame * 0.00001 });
            buffer.renderDiff();
          }
          const frameMs = (performance.now() - start) / 10;
          buffer.clear(true);
          renderer.drawOrbitInterface(model);
          buffer.renderFull();
          const figure = document.createElement('figure');
          const result = document.createElement('canvas');
          result.width = 296;
          result.height = 264;
          const ctx = result.getContext('2d');
          ctx.drawImage(mainCanvas, 6 * 8, 12 * 8, 296, 264, 0, 0, 296, 264);
          ctx.drawImage(raster, 6 * 8, 12 * 8, 296, 264, 0, 0, 296, 264);
          const pixels = ctx.getImageData(0, 0, 296, 264).data;
          result.dataset.litPixels = Array.from(pixels).filter((v, i) => i % 4 !== 3 && v > 30).length;
          const label = document.createElement('figcaption');
          label.textContent =
            profile.name +
            ' / ' +
            phaseName +
            ' ' +
            phase.toFixed(4) +
            ' / ' +
            frameMs.toFixed(1) +
            'ms/frame';
          figure.append(result, label);
          document.querySelector('main').append(figure);
        }
      }
      document.body.dataset.ready = 'true';
    </script>
  </body>
</html>
