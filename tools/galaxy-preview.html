<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Galaxy rendering preview</title>
    <style>
      body {
        margin: 0;
        background: #010202;
        overflow: hidden;
      }
      canvas {
        position: absolute;
        inset: 0;
        image-rendering: pixelated;
      }
    </style>
  </head>
  <body>
    <canvas id="terminal"></canvas><canvas id="raster"></canvas>
    <script type="module">
      import '../src/assets/fonts/fonts.css';
      import { CONFIG } from '../src/config.ts';
      import { ScreenBuffer } from '../src/rendering/screen_buffer.ts';
      import { MilkyWayModel } from '../src/generation/milky_way_model.ts';
      import { GalaxyMapController } from '../src/core/galaxy_map.ts';
      import { GalaxyMapRenderer } from '../src/rendering/galaxy_map_renderer.ts';
      import { SceneRenderer } from '../src/rendering/scene_renderer.ts';
      import { DrawingContext } from '../src/rendering/drawing_context.ts';
      import { NebulaRenderer } from '../src/rendering/nebula_renderer.ts';
      import { NebulaColourSampler } from '../src/rendering/nebula_colour_sampler.ts';
      import { SystemDataGenerator } from '../src/generation/system_data_generator.ts';
      import { Player } from '../src/core/player.ts';
      import { PRNG } from '../src/utils/prng.ts';
      const query = new URLSearchParams(location.search);
      const main = document.querySelector('#terminal');
      const raster = document.querySelector('#raster');
      const size = 8;
      const cols = Math.floor(innerWidth / size);
      const rows = Math.floor(innerHeight / size);
      for (const canvas of [main, raster]) {
        canvas.width = cols * size;
        canvas.height = rows * size;
      }
      await document.fonts.load('8px PxPlus_IBM_CGA');
      const buffer = new ScreenBuffer(main, main.getContext('2d'), false, raster, raster.getContext('2d'));
      buffer.updateDimensions(cols, rows, size, size);
      const seed = query.get('seed') ?? CONFIG.SEED;
      const galaxy = new MilkyWayModel(seed);
      const controller = new GalaxyMapController();
      const renderer = new GalaxyMapRenderer(buffer, galaxy);
      for (let i = 0; i < Number(query.get('zoom') ?? 0); i++) controller.zoom(1, galaxy, 0, 0);
      const model = controller.createModel(galaxy, CONFIG.PLAYER_START_X, CONFIG.PLAYER_START_Y);
      const start = performance.now();
      if (query.get('mode') === 'hyperspace') {
        const sampler = new NebulaColourSampler(`${seed}_nebula`);
        const nebula = new NebulaRenderer({
          getBackgroundColor: (x, y) => sampler.sample(x, y),
          getBackgroundColorsAsync: async (requests) =>
            requests.map(({ worldX, worldY }) => ({
              worldX,
              worldY,
              colour: sampler.sample(worldX, worldY),
            })),
          clearCache: () => sampler.clearCache(),
        });
        const player = new Player();
        player.position.worldX += Number(query.get('x') ?? 0);
        player.position.worldY += Number(query.get('y') ?? 0);
        const scene = new SceneRenderer(
          buffer,
          new DrawingContext(buffer),
          nebula,
          new SystemDataGenerator(new PRNG(seed))
        );
        scene.drawHyperspace(player);
      } else {
        renderer.draw(model);
      }
      buffer.renderFull();
      document.body.dataset.renderMs = (performance.now() - start).toFixed(1);
      const measuredCanvas = query.get('mode') === 'hyperspace' ? main : raster;
      const pixels = measuredCanvas
        .getContext('2d')
        .getImageData(0, 0, measuredCanvas.width, measuredCanvas.height).data;
      let lit = 0;
      for (let i = 0; i < pixels.length; i += 4)
        if (Math.max(pixels[i], pixels[i + 1], pixels[i + 2]) > 25) lit++;
      document.body.dataset.litPixels = String(lit);
      document.body.dataset.ready = 'true';
    </script>
  </body>
</html>
